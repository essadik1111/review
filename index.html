<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>مراجعة الفصول</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23ff9f0a'/%3E%3Cg transform='translate(17 17) scale(2.75)' fill='none' stroke='%231a1000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='5' r='3'/%3E%3Cline x1='12' y1='22' x2='12' y2='8'/%3E%3Cpath d='M5 12H2a10 10 0 0 0 20 0h-3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#000; --s1:#1c1c1e; --s2:#2c2c2e; --s3:#3a3a3c;
  --tx:#f5f5f7; --tx2:#a1a1a6; --tx3:#6e6e73;
  --ac:#ff9f0a; --ac2:#ff8a00; --ac-soft:rgba(255,159,10,.14);
  --red:#ff453a; --green:#32d74b; --line:rgba(255,255,255,.09);
  --hdr:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ico{display:inline-flex;width:20px;height:20px}
.ico svg{width:100%;height:100%}

#app{display:flex;flex-direction:column;height:100dvh}
#hdr{height:var(--hdr);flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;
  background:rgba(28,28,30,.72);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid var(--line);z-index:20}
.hl,.hr{display:flex;align-items:center;gap:8px;min-width:0}
.hl{flex:1}
.brand{display:flex;align-items:center;gap:10px;font-size:17px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#ffb340,#ff8a00);color:#1a1000;display:grid;place-items:center}
.logo .ico{width:20px;height:20px}
.ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.ttl span{color:var(--tx2)}
main{flex:1;min-height:0;position:relative}

.btn{height:38px;padding:0 16px;border-radius:12px;background:var(--s2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ac);color:#1a1000}
.btn.primary:hover{background:#ffb02e}
.btn.danger{background:rgba(255,69,58,.15);color:var(--red)}
.btn.danger:hover{background:rgba(255,69,58,.25)}
.btn.on{background:var(--ac);color:#1a1000}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:12px;display:inline-grid;place-items:center;background:var(--s2);transition:.15s;position:relative;flex:none}
.icon-btn:hover{background:var(--s3)}
.icon-btn.on{background:var(--ac);color:#1a1000}
.badge{position:absolute;top:-4px;inset-inline-start:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#1a1000;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.zoom{display:flex;align-items:center;background:var(--s2);border-radius:12px;height:38px}
.zoom button{width:36px;height:38px;display:grid;place-items:center;border-radius:12px}
.zoom button:hover{background:var(--s3)}
.zoom span{min-width:44px;text-align:center;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;cursor:pointer}

/* home */
.home{height:100%;overflow:auto;padding:28px 18px 60px}
.home-in{max-width:980px;margin:0 auto}
.home h1{font-size:30px;font-weight:700;letter-spacing:-.3px}
.home p.sub{color:var(--tx2);margin:4px 0 22px}
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:6px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:start;transition:.18s;display:flex;flex-direction:column;gap:6px;min-height:130px}
.card:hover{transform:translateY(-3px);border-color:rgba(255,159,10,.5);background:#202022}
.card .n{font-size:34px;font-weight:800;color:var(--ac);letter-spacing:-1px;line-height:1}
.card .t{font-weight:600;font-size:16px;margin-top:auto}
.card .m{color:var(--tx3);font-size:13px}
.empty{color:var(--tx2);text-align:center;padding:70px 20px;border:1px dashed var(--s3);border-radius:20px}

/* reader */
.layout{display:flex;height:100%}
.reader{flex:1;overflow:auto;background:#0b0b0c;direction:ltr;scroll-behavior:auto;padding:14px 8px 120px;overscroll-behavior:contain}
.pages{margin:0 auto;display:flex;flex-direction:column;gap:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body.pinning .page{cursor:crosshair}
.page{position:relative;background:#141416;border-radius:6px;overflow:visible;min-height:60px}
.page:not(.loaded){aspect-ratio:2/3;background:linear-gradient(100deg,#141416 30%,#1d1d20 50%,#141416 70%);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.page img{display:block;width:100%;height:auto;border-radius:6px;-webkit-user-drag:none}
.page-num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#ddd;font-size:11px;padding:2px 9px;border-radius:99px;pointer-events:none;direction:ltr}
.page-err{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx2);font-size:13px;direction:rtl}
.pin-layer{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:30px;height:38px;transform:translate(-50%,-100%);pointer-events:auto;transition:transform .15s;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));direction:ltr}
.pin:hover{transform:translate(-50%,-100%) scale(1.12)}
.pin-body{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#1a1000;display:grid;place-items:center;border:2px solid #fff}
.pin-body .ico{width:16px;height:16px}
.pin::after{content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);border:6px solid transparent;border-top:9px solid #fff;border-bottom:0}
.pin-n{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:#1c1c1e;color:#fff;border:1.5px solid var(--ac);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pin.done .pin-body{background:var(--green);}
.pin.done .pin-n{border-color:var(--green)}
.pin.temp{pointer-events:none;animation:drop .3s}
@keyframes drop{from{transform:translate(-50%,-160%);opacity:0}}
.pin.pulse{animation:pulse 1.1s 2}
@keyframes pulse{0%,100%{transform:translate(-50%,-100%) scale(1)}50%{transform:translate(-50%,-100%) scale(1.5)}}
.pin.pulse .pin-body{box-shadow:0 0 0 0 rgba(255,159,10,.8);animation:ring 1.1s 2}
@keyframes ring{to{box-shadow:0 0 0 22px rgba(255,159,10,0)}}
.banner{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:rgba(44,44,46,.9);backdrop-filter:blur(20px);border:1px solid var(--ac);border-radius:99px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;z-index:25;transition:.25s;white-space:nowrap}
body.pinning .banner{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.banner b{color:var(--ac)}
.banner button{background:var(--s3);border-radius:99px;padding:4px 14px;font-size:13px}

/* panel */
.panel{width:370px;flex:none;background:var(--s1);border-inline-start:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.panel.open{display:flex}
.p-head{padding:16px 16px 10px}
.p-head h3{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;background:var(--s2);border-radius:11px;padding:3px;margin:12px 0 10px}
.tabs button{flex:1;padding:6px 0;border-radius:9px;font-size:13px;color:var(--tx2);font-weight:600}
.tabs button.on{background:var(--s3);color:var(--tx)}
.search{position:relative}
.search .ico{position:absolute;top:10px;inset-inline-start:12px;width:17px;height:17px;color:var(--tx3)}
.search input{padding-inline-start:38px!important}
.p-list{flex:1;overflow:auto;padding:4px 12px 20px}
.p-grp{font-size:12px;color:var(--tx3);margin:14px 6px 6px;font-weight:600;letter-spacing:.3px}
.note{display:flex;gap:10px;width:100%;text-align:start;background:var(--s2);border-radius:14px;padding:11px 12px;margin-bottom:8px;transition:.15s;border:1px solid transparent}
.note:hover{border-color:rgba(255,159,10,.55)}
.note .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#1a1000;font-weight:800;font-size:12px;display:grid;place-items:center;margin-top:1px}
.note.done .no{background:var(--green)}
.note.done{opacity:.6}
.note .nb{min-width:0;flex:1}
.note .au{font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;gap:8px}
.note .tx{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.note .sg{font-size:13px;color:var(--ac);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.p-empty{color:var(--tx3);text-align:center;padding:40px 10px;font-size:14px}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:50;padding:14px}
.backdrop.show{opacity:1}
.modal{width:min(480px,100%);max-height:92dvh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.65);transform:scale(.95);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.backdrop.show .modal{transform:none}
.modal.wide{width:min(600px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.modal-h h3{font-size:18px}
.modal-b{padding:8px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--tx2);font-weight:600}
.inp{width:100%;background:var(--s2);border:1.5px solid transparent;color:var(--tx);font:inherit;border-radius:12px;padding:11px 14px;outline:none;transition:.15s;resize:vertical}
.inp:focus{border-color:var(--ac);background:#323234}
.inp::placeholder{color:var(--tx3)}
.hint{font-size:12.5px;color:var(--tx3)}
.read{background:var(--s2);border-radius:14px;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.read.sg{background:var(--ac-soft);border:1px solid rgba(255,159,10,.35)}
.lbl{font-size:12px;color:var(--tx2);font-weight:600;margin-bottom:4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--tx2);font-size:13px}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ac-soft);color:var(--ac)}
.tag.ok{background:rgba(50,215,75,.14);color:var(--green)}
.rows{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto}
.row{background:var(--s2);border-radius:11px;padding:8px 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;direction:ltr}
.row .st{flex:none;font-size:12px;direction:rtl}
.row.ok .st{color:var(--green)} .row.fail .st{color:var(--red)} .row.up .st{color:var(--ac)}
.row .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
.logbox{background:#000;border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--tx2);max-height:200px;overflow:auto;white-space:pre-wrap;direction:rtl}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none}
.toast{background:rgba(44,44,46,.95);backdrop-filter:blur(20px);border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:14px;animation:tin .25s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{border-color:var(--red);color:#ffb4af}
.toast.out{opacity:0;transition:.4s}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
.setup{max-width:560px;margin:8vh auto;padding:0 18px}
.setup .box{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:26px}
.setup ol{padding-inline-start:20px;margin-top:12px;display:flex;flex-direction:column;gap:8px;color:var(--tx2)}
.setup code,.hint code{background:var(--s2);padding:1px 7px;border-radius:6px;color:var(--ac);direction:ltr;display:inline-block;font-size:12.5px}

@media (max-width:900px){
  .panel{position:fixed;inset-inline:0;bottom:0;width:100%;height:74dvh;border-radius:22px 22px 0 0;border:1px solid var(--line);display:flex;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:30;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .panel.open{transform:none}
}
@media (max-width:640px){
  #hdr{padding:0 10px;gap:6px}
  .btn .lbl{display:none}
  .btn.pinbtn{padding:0;width:38px}
  .zoom span{display:none}
  .backdrop{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;border-radius:24px 24px 0 0;transform:translateY(40px);padding-bottom:env(safe-area-inset-bottom)}
  .home h1{font-size:25px}
}
</style>
</head>

function icon(name) {
  const s = document.createElement('span');
  s.className = 'ico';
  s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[name]}</svg>`;

function toast(msg, kind) {
  const t = h('div', { class: 'toast ' + (kind || '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => t.classList.add('out'), 2800);
  setTimeout(() => t.remove(), 3300);
}

function modal({ title, body, actions, wide, onClose, lock }) {
  const back = h('div', { class: 'backdrop' });
  let closed = false;
  const close = (force) => {
    if (closed) return;
    if (!force && lock && lock()) { toast('انتظر حتى ينتهي العمل الجاري'); return; }
    closed = true;
    back.classList.remove('show');
    setTimeout(() => back.remove(), 220);
    onClose && onClose();
  };
  const box = h('div', { class: 'modal' + (wide ? ' wide' : '') },
    h('div', { class: 'modal-h' }, h('h3', {}, title), h('button', { class: 'icon-btn', 'aria-label': 'إغلاق', onclick: () => close() }, icon('x'))),
    h('div', { class: 'modal-b' }, body),
    actions ? h('div', { class: 'modal-f' }, actions) : null);
  back.append(box);
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  document.body.append(back);
  requestAnimationFrame(() => back.classList.add('show'));
  return { close, el: box };
}

function confirmBox(title, msg, okText, danger) {
  return new Promise(res => {
    let decided = false;
    const m = modal({
      title, body: h('p', { style: { color: 'var(--tx2)' } }, msg),

        h('button', { class: 'btn', onclick: () => m.close() }, 'إلغاء'),

      onClose: () => { if (!decided) res(false); }

/* ==========================================================================
   imgchest
   ========================================================================== */
async function uploadOne(file, key) {
  let last = '';
  for (let a = 1; a <= 4; a++) {
    try {
      const fd = new FormData();
      fd.append('images[]', file, file.name);
      const r = await fetch(API + '/post', { method: 'POST', headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' }, body: fd });
      if (r.status === 429) { last = 'تجاوز حد الطلبات'; await sleep(4000 * a); continue; }
      if (r.status === 401 || r.status === 403) { const e = new Error('المفتاح مرفوض (HTTP ' + r.status + ')'); e.fatal = true; throw e; }
      if (!r.ok) { last = 'HTTP ' + r.status; if (r.status >= 500) { await sleep(1500 * a); continue; } throw new Error(last); }
      const j = await r.json();
      const d = j.data || {};
      const link = d.images && d.images[0] && d.images[0].link;
      if (!d.id || !link) throw new Error('رد غير متوقع من imgchest');
      return { url: link, postId: d.id };
    } catch (e) {
      if (e instanceof TypeError) { last = 'تعذر الاتصال بـ imgchest (شبكة أو CORS)'; await sleep(900 * a); continue; }
      throw e;
    }
  }
  throw new Error(last || 'فشل الرفع');
}

async function runUploads(items, key, onUpdate) {
  let stop = false;
  for (let pass = 1; pass <= 3 && !stop; pass++) {
    const todo = items.filter(i => i.state !== 'ok');
    if (!todo.length) break;
    let idx = 0;
    const worker = async () => {
      while (idx < todo.length && !stop) {
        const it = todo[idx++];
        it.state = 'up'; onUpdate();
        try { it.result = await uploadOne(it.file, key); it.state = 'ok'; it.err = ''; }
        catch (e) { it.state = 'fail'; it.err = e.message; if (e.fatal) stop = true; }
        onUpdate();
      }
    };
    await Promise.all(Array.from({ length: 4 }, worker));
  }
}

async function deletePost(id, key) {
  for (let a = 1; a <= 4; a++) {
    try {
      const r = await fetch(API + '/post/' + encodeURIComponent(id), { method: 'DELETE', headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' } });
      if (r.status === 429) { await sleep(4000 * a); continue; }
      if (r.ok || r.status === 404) return { ok: true };
      if (r.status >= 500) { await sleep(1500 * a); continue; }
      return { ok: false, msg: 'HTTP ' + r.status };
    } catch (e) { await sleep(1000 * a); }
  }
  return { ok: false, msg: 'تعذر الاتصال' };
}

function baseWidth() {
  const r = $('#reader');
  return Math.min((r ? r.clientWidth : window.innerWidth) - 16, 900);
}
function applyWidth() {
  const p = $('#pages');
  if (p) p.style.width = (baseWidth() * S.zoom) + 'px';
}
window.addEventListener('resize', applyWidth);

function setZoom(z) {
  z = clamp(Math.round(z * 100) / 100, 0.5, 3);
  const r = $('#reader');
  if (!r) { S.zoom = z; return; }
  const ry = (r.scrollTop + r.clientHeight / 2) / r.scrollHeight;
  const rx = (r.scrollLeft + r.clientWidth / 2) / r.scrollWidth;
  S.zoom = z;
  applyWidth();
  r.scrollTop = ry * r.scrollHeight - r.clientHeight / 2;
  r.scrollLeft = rx * r.scrollWidth - r.clientWidth / 2;
  renderHeader();
}

function togglePin(v) {
  S.pinMode = v === undefined ? !S.pinMode : v;
  document.body.classList.toggle('pinning', S.pinMode);
  renderHeader();
}
$('#banner-x').addEventListener('click', () => togglePin(false));

  const bar = h('i');
  const rows = h('div', { class: 'rows' });
  const startBtn = h('button', { class: 'btn primary' }, 'ابدأ الرفع');

  function draw() {
    const ok = items.filter(i => i.state === 'ok').length;
    const fail = items.filter(i => i.state === 'fail').length;
    summary.textContent = items.length ? `${items.length} صفحة` + (running || ok || fail ? ` · نجح ${ok}` + (fail ? ` · فشل ${fail}` : '') : '') : 'لم تُختر صفحات بعد (تُرتّب تلقائيا حسب اسم الملف)';
    bar.style.width = items.length ? (ok / items.length * 100) + '%' : '0';
    rows.replaceChildren(...items.map(i => h('div', { class: 'row ' + i.state, title: i.err || '' },
      h('span', { class: 'fn' }, i.file.name),
      h('span', { class: 'st' }, i.state === 'wait' ? 'بالانتظار' : i.state === 'up' ? 'جاري الرفع' : i.state === 'ok' ? 'تم' : 'فشل: ' + i.err))));
  }
  fileIn.addEventListener('change', () => {
    items = [...fileIn.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })).map(f => ({ file: f, state: 'wait', err: '' }));
    draw();
  });
  draw();

  async function go() {
    if (running) return;
    if (!num.value.trim()) { num.focus(); return toast('اكتب رقم الفصل', 'err'); }
    if (!items.length) return toast('اختر صفحات الفصل أولا', 'err');
    running = true; startBtn.disabled = true; pickBtn.disabled = true;
    await runUploads(items, getKey(), draw);
    running = false;
    if (items.every(i => i.state === 'ok')) {
      try {
        const ref = await addDoc(collection(db, 'chapters'), { number: num.value.trim(), title: title.value.trim(), pages: items.map(i => i.result), createdAt: Date.now() });
        m.close(true);
        toast('تم رفع الفصل');
        location.hash = '#/c/' + ref.id;
      } catch (e) { toast('رُفعت الصور لكن تعذر حفظ الفصل: ' + e.message, 'err'); startBtn.disabled = false; startBtn.textContent = 'إعادة محاولة الحفظ'; startBtn.onclick = null; }
    } else {
      startBtn.disabled = false; pickBtn.disabled = false; startBtn.textContent = 'إعادة محاولة الفاشل';
    }
  }
  startBtn.addEventListener('click', go);
  const m = modal({
    title: 'رفع فصل جديد', wide: true, lock: () => running,
    body: [field('رقم الفصل', num), field('العنوان', title), h('div', {}, pickBtn, fileIn), summary, h('div', { class: 'prog' }, bar), rows],
    actions: [h('button', { class: 'btn', onclick: () => m.close() }, 'إلغاء'), startBtn]
  });
}

/* ==========================================================================
   حذف فصل
   ========================================================================== */
async function openDeleteChapter(ch) {
  if (!getKey()) { toast('أدخل مفتاح imgchest أولا', 'err'); return openSettings(); }
  const ok = await confirmBox('حذف الفصل ' + ch.number, 'سيتم حذف صور الفصل من imgchest وكل ملاحظاته نهائيا. لا يمكن التراجع.', 'احذف كل شيء', true);
  if (!ok) return;
  let busy = true;
  const log = h('div', { class: 'logbox' });
  const bar = h('i');
  const say = t => { log.append(t + '\n'); log.scrollTop = log.scrollHeight; };
  const m = modal({ title: 'جاري حذف الفصل', body: [h('div', { class: 'prog' }, bar), log], lock: () => busy });
  const posts = (ch.pages || []).filter(p => p.postId);
  let fails = 0;
  for (let i = 0; i < posts.length; i++) {
    const r = await deletePost(posts[i].postId, getKey());
    if (!r.ok) { fails++; say(`صفحة ${i + 1}: فشل الحذف (${r.msg})`); }
    else say(`صفحة ${i + 1}: حُذفت`);
    bar.style.width = ((i + 1) / (posts.length + 1) * 100) + '%';
    if (i < posts.length - 1) await sleep(1050);
  }
  try {
    say('حذف الملاحظات...');
    const snap = await getDocs(query(collection(db, 'notes'), where('chapterId', '==', ch.id)));
    let batch = writeBatch(db), c = 0;
    for (const d of snap.docs) { batch.delete(d.ref); if (++c % 450 === 0) { await batch.commit(); batch = writeBatch(db); } }
    await batch.commit();
    await deleteDoc(doc(db, 'chapters', ch.id));
    bar.style.width = '100%';
    say(fails ? `انتهى مع ${fails} فشل في imgchest (احذفها يدويا).` : 'اكتمل الحذف.');
    busy = false;
    location.hash = '#/';
    setTimeout(() => m.close(true), fails ? 3500 : 700);
  } catch (e) {
    busy = false;
    say('تعذر حذف بيانات الموقع: ' + e.message);
    toast('تعذر حذف الفصل من الموقع', 'err');
  }
}

/* ==========================================================================
   التوجيه والعرض
   ========================================================================== */
function showMessage(t, extra) {
  $('#main').replaceChildren(h('div', { class: 'home' }, h('div', { class: 'home-in' }, h('div', { class: 'empty' }, t, extra))));
}

function render() {
  renderHeader();
  if (!S.loaded) return showMessage('جاري التحميل...');
  const ch = curChapter();
  if (S.chapterId && !ch) return showMessage('هذا الفصل غير موجود أو حُذف. ', h('a', { href: '#/', style: { color: 'var(--ac)' } }, 'العودة للفصول'));
  if (!ch) { S.builtFor = null; return renderHome(); }
  const sig = ch.id + ':' + (ch.pages || []).length;
  if (S.builtFor !== sig) { buildReader(ch); S.builtFor = sig; }
  renderPins(); renderPanel();
}

function subscribeNotes(id) {
  if (S.unsub) { S.unsub(); S.unsub = null; }
  S.notes = [];
  if (!id) return;
  S.unsub = onSnapshot(query(collection(db, 'notes'), where('chapterId', '==', id)), snap => {
    S.notes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (S.chapterId === id && S.loaded) { renderHeader(); renderPins(); renderPanel(); }
  }, err => toast('تعذر قراءة الملاحظات: ' + err.message, 'err'));
}

function route() {
  const m = location.hash.match(/^#\/c\/(.+)$/);
  const id = m ? decodeURIComponent(m[1]) : null;
  if (id !== S.chapterId) {
    S.chapterId = id; S.builtFor = null; S.search = ''; S.filter = 'all';
    if (S.pinMode) togglePin(false);
    subscribeNotes(id);
  }
  render();
}

function setupScreen() {
  $('#hdr').replaceChildren(h('div', { class: 'brand' }, h('span', { class: 'logo' }, icon('anchor')), h('b', {}, CONFIG.SITE_TITLE)));
  $('#main').replaceChildren(h('div', { class: 'setup' }, h('div', { class: 'box' },
    h('h2', {}, 'خطوة واحدة قبل البدء'),
    h('p', { style: { color: 'var(--tx2)', marginTop: '6px' } }, 'الموقع يحتاج بيانات Firebase ليحفظ الملاحظات:'),
    h('ol', {},
      h('li', {}, 'أنشئ مشروعا في ', h('code', {}, 'console.firebase.google.com')),
      h('li', {}, 'من Build ثم Firestore Database أنشئ قاعدة بيانات'),
      h('li', {}, 'من إعدادات المشروع أضف تطبيق Web وانسخ الإعدادات'),
      h('li', {}, 'الصقها في ', h('code', {}, 'CONFIG.firebase'), ' أعلى ملف index.html على GitHub'),
      h('li', {}, 'غيّر ', h('code', {}, 'ADMIN_CODE'), ' إلى كود سري خاص بك')))));
}

/* ---------- البدء ---------- */
window.addEventListener('hashchange', route);
if (!db) {
  setupScreen();
} else {
  renderHeader();
  showMessage('جاري التحميل...');
  onSnapshot(collection(db, 'chapters'), snap => {
    S.chapters = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    S.loaded = true;
    route();
  }, err => {
    S.loaded = false;
    renderHeader();
    showMessage('تعذر الاتصال بقاعدة البيانات: ' + err.message);
  });
  route();
}
</script>
